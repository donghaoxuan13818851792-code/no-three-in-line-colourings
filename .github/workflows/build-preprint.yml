name: Build preprint PDF

on:
  push:
    branches: [main]
    paths:
      - "paper/.tex_parts/**"
      - ".github/workflows/build-preprint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for temporary source parts
        id: parts
        shell: bash
        run: |
          shopt -s nullglob
          parts=(paper/.tex_parts/part-*.texpart)
          if [ ${#parts[@]} -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble arXiv source
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          cat paper/.tex_parts/part-*.texpart > paper/arxiv.tex
          sed 's/\\date{\\today}/\\date{September 22, 2026}/' paper/arxiv.tex > paper/preprint-build.tex

      - name: Compile preprint
        if: steps.parts.outputs.present == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: preprint-build.tex

      - name: Commit public preprint
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          mv paper/preprint-build.pdf paper/preprint.pdf
          rm -f paper/preprint-build.aux paper/preprint-build.log paper/preprint-build.out paper/preprint-build.tex
          rm -rf paper/.tex_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A paper
          git commit -m "Build public preprint PDF"
          git push
